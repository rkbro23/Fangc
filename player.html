<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FANCOD · RK — Stream</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js">
    </script>
    <style>
        /* ── Reset & Retro Dark Theme ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0a0a0a;
            --card: #121212;
            --text: #e6e6e6;
            --text-muted: #7a7a7a;
            --border: #232323;
            --accent: #00d2ff;
            --accent-dim: rgba(0, 210, 255, .10);
            --accent-glow: rgba(0, 210, 255, .20);
            --radius: 6px;
            --shadow: 0 4px 16px rgba(0, 0, 0, .8);
        }
        [data-theme="light"] {
            --bg: #ececec;
            --card: #ffffff;
            --text: #121212;
            --text-muted: #5a5a5a;
            --border: #ccc;
            --accent: #0088cc;
            --accent-dim: rgba(0, 136, 204, .08);
            --accent-glow: rgba(0, 136, 204, .15);
            --shadow: 0 4px 16px rgba(0, 0, 0, .06);
        }
        html,
        body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 2px;
        }

        /* ── Header ── */
        header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 0.6rem 1.2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(4px);
        }
        .header-content {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.6rem;
        }
        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .logo span {
            color: var(--accent);
        }
        .logo small {
            font-size: 0.65rem;
            font-weight: 400;
            color: var(--text-muted);
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .back-btn,
        .icon-btn {
            background: var(--accent-dim);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.3rem 0.8rem;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.85rem;
            transition: background .15s, color .15s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-family: inherit;
        }
        .back-btn:hover,
        .icon-btn:hover {
            background: var(--accent);
            color: #000;
        }
        .icon-btn {
            width: 34px;
            height: 34px;
            justify-content: center;
            padding: 0;
            border-radius: 50%;
        }

        /* ── Main ── */
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* ── Player ── */
        .player-container {
            position: relative;
            background: #000;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            aspect-ratio: 16/9;
            overflow: hidden;
        }
        .player-container video {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }

        /* ── Overlay ── */
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .8);
            backdrop-filter: blur(4px);
            gap: 0.8rem;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
        }
        .overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .overlay .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .overlay p {
            color: #fff;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        .overlay .error-icon {
            font-size: 2rem;
            color: #ff4444;
        }
        .overlay .retry-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 0.4rem 1.6rem;
            border-radius: var(--radius);
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
        .overlay .retry-btn:hover {
            transform: scale(1.03);
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Footer ── */
        footer {
            background: var(--card);
            border-top: 1px solid var(--border);
            padding: 0.8rem 1.2rem;
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        footer .disclaimer {
            max-width: 700px;
            margin: 0 auto 0.1rem;
            opacity: 0.6;
        }

        /* ── Responsive ── */
        @media (max-width:640px) {
            .logo {
                font-size: 1.2rem;
            }
            .logo small {
                display: none;
            }
            main {
                padding: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <a href="index.html" class="logo">FANCOD <span>·</span> RK <small>Stream</small></a>
            <div class="controls">
                <button class="back-btn" onclick="window.location.href='index.html'">
                    <i class="fas fa-arrow-left"></i> Back
                </button>
                <button class="icon-btn" id="themeBtn" title="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main>
        <!-- Player -->
        <div class="player-container" id="playerContainer">
            <video id="videoPlayer" controls autoplay playsinline preload="auto"></video>
            <div class="overlay" id="playerOverlay">
                <div class="spinner" id="overlaySpinner"></div>
                <p id="overlayText">Loading stream …</p>
            </div>
        </div>
    </main>

    <footer>
        <div class="disclaimer"><i class="fas fa-shield-alt"></i> Educational only. We do not host streams.</div>
    </footer>

    <script>
        /* ============================================================
           CONFIG
           ============================================================ */
        const PROXY_URL = 'https://fcproxy-1j8b.onrender.com/proxy.php?id=';

        /* ============================================================
           DOM REFS
           ============================================================ */
        const video = document.getElementById('videoPlayer');
        const overlay = document.getElementById('playerOverlay');
        const overlaySpinner = document.getElementById('overlaySpinner');
        const overlayText = document.getElementById('overlayText');
        const themeBtn = document.getElementById('themeBtn');

        /* ============================================================
           THEME
           ============================================================ */
        (function initTheme() {
            const stored = localStorage.getItem('fc-theme');
            const prefers = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            const theme = stored || prefers;
            document.documentElement.setAttribute('data-theme', theme);
            updateThemeIcon(theme);
        })();

        function updateThemeIcon(theme) {
            const icon = themeBtn.querySelector('i');
            icon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
        }

        themeBtn.addEventListener('click', () => {
            const cur = document.documentElement.getAttribute('data-theme');
            const next = cur === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('fc-theme', next);
            updateThemeIcon(next);
        });

        /* ============================================================
           OVERLAY
           ============================================================ */
        function showOverlay(show, text) {
            if (show) {
                overlay.classList.add('visible');
                overlaySpinner.style.display = 'block';
                overlayText.textContent = text || 'Loading …';
                // Remove any old error icon or retry button
                const oldErr = overlay.querySelector('.error-icon');
                if (oldErr) oldErr.remove();
                const oldBtn = overlay.querySelector('.retry-btn');
                if (oldBtn) oldBtn.remove();
            } else {
                overlay.classList.remove('visible');
            }
        }

        function hideOverlay() { showOverlay(false); }

        function showError(msg) {
            overlay.classList.add('visible');
            overlaySpinner.style.display = 'none';
            overlayText.textContent = msg || 'Error';
            // Remove old error icon and retry button if any
            const oldErr = overlay.querySelector('.error-icon');
            if (oldErr) oldErr.remove();
            const oldBtn = overlay.querySelector('.retry-btn');
            if (oldBtn) oldBtn.remove();

            const icon = document.createElement('div');
            icon.className = 'error-icon';
            icon.innerHTML = '<i class="fas fa-triangle-exclamation"></i>';
            overlay.prepend(icon);

            const btn = document.createElement('button');
            btn.className = 'retry-btn';
            btn.textContent = 'Retry';
            btn.onclick = () => {
                const id = getMatchId();
                if (id) {
                    const streamUrl = PROXY_URL + id;
                    loadStream(streamUrl);
                } else {
                    showError('No match ID.');
                }
            };
            overlay.appendChild(btn);
        }

        /* ============================================================
           PLAYER ENGINE (HLS.js primary, native fallback)
           ============================================================ */
        let hlsInstance = null;
        let currentStreamUrl = null;

        function loadStream(url) {
            if (!url) {
                showError('No stream URL.');
                return;
            }
            currentStreamUrl = url;
            showOverlay(true, 'Loading stream …');

            // Destroy previous HLS instance
            try {
                if (hlsInstance) {
                    hlsInstance.destroy();
                    hlsInstance = null;
                }
            } catch (_) {}

            // Clear video
            video.removeAttribute('src');
            video.load();

            // Attempt HLS.js if supported
            if (Hls.isSupported()) {
                const hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backbufferLength: 30,
                    maxBufferSize: 60 * 1000 * 1000,
                    maxBufferLength: 30,
                    liveSyncDurationCount: 3,
                    liveMaxLatencyDurationCount: 10,
                    enableWebVTT: true,
                });
                hlsInstance = hls;

                hls.loadSource(url);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    hideOverlay();
                    video.play().catch(() => {});
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        console.error('[HLS.js] Fatal error:', data);
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                            hls.startLoad();
                            showOverlay(true, 'Network error, retrying …');
                            setTimeout(() => {
                                if (hlsInstance) hls.loadSource(url);
                            }, 2000);
                            return;
                        }
                        if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                            hls.recoverMediaError();
                            return;
                        }
                        // Fatal: fallback to native
                        fallbackToNative(url);
                    } else {
                        console.warn('[HLS.js] Non-fatal:', data);
                    }
                });

                // Fallback if manifest doesn't load within 10s
                let manifestTimeout = setTimeout(() => {
                    if (!video.currentTime && !video.readyState && hlsInstance) {
                        console.warn('HLS.js manifest load timeout, falling back to native');
                        fallbackToNative(url);
                    }
                }, 10000);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    clearTimeout(manifestTimeout);
                });

            } else {
                // HLS not supported, use native
                fallbackToNative(url);
            }
        }

        function fallbackToNative(url) {
            // Destroy HLS
            try {
                if (hlsInstance) {
                    hlsInstance.destroy();
                    hlsInstance = null;
                }
            } catch (_) {}

            video.removeAttribute('src');
            video.load();
            video.src = url;
            video.load();

            const onCanPlay = () => {
                hideOverlay();
                video.play().catch(() => {});
                video.removeEventListener('canplay', onCanPlay);
            };
            video.addEventListener('canplay', onCanPlay);

            video.onerror = () => {
                const error = video.error;
                let msg = 'Native playback error.';
                if (error) {
                    if (error.code === MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED) {
                        msg = 'Browser does not support this stream.';
                    } else if (error.code === MediaError.MEDIA_ERR_NETWORK) {
                        msg = 'Network error loading stream.';
                    } else if (error.code === MediaError.MEDIA_ERR_DECODE) {
                        msg = 'Decode error — stream may be corrupted.';
                    } else {
                        msg = error.message || 'Unknown media error.';
                    }
                }
                showError(msg);
                video.removeEventListener('canplay', onCanPlay);
            };

            // Timeout: if no canplay after 15s, show error
            setTimeout(() => {
                if (!video.currentTime && !video.readyState) {
                    video.removeEventListener('canplay', onCanPlay);
                    showError('Native playback timed out.');
                }
            }, 15000);
        }

        /* ============================================================
           INIT
           ============================================================ */
        function getMatchId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        function init() {
            const id = getMatchId();
            if (!id) {
                showError('No match ID provided.');
                return;
            }
            const streamUrl = PROXY_URL + id;
            loadStream(streamUrl);
        }

        init();

        // Expose for debugging
        window.__state = { video, hlsInstance, currentStreamUrl };
    </script>
</body>
</html>
