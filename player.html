<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FANCOD · RK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ── Reset & Root ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0b0b0b;
            --card: #141414;
            --card-hover: #1c1c1c;
            --text: #e0e0e0;
            --text-muted: #777;
            --border: #2a2a2a;
            --accent: #00ff00;
            --accent-dim: rgba(0, 255, 0, .08);
            --radius: 4px;
            --shadow: 0 2px 8px rgba(0,0,0,.5);
            --transition: .15s ease;
        }
        [data-theme="light"] {
            --bg: #f0f0f0;
            --card: #ffffff;
            --card-hover: #f5f5f5;
            --text: #1a1a1a;
            --text-muted: #666;
            --border: #ccc;
            --shadow: 0 2px 8px rgba(0,0,0,.06);
            --accent-dim: rgba(0,200,0,.06);
        }
        html, body { height: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

        /* ── Header ── */
        header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 0.6rem 1.2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.6rem;
        }
        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .logo span { color: var(--accent); }
        .logo small {
            font-size: 0.65rem;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .icon-btn {
            background: var(--accent-dim);
            border: 1px solid var(--border);
            color: var(--text);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: background var(--transition), color var(--transition);
        }
        .icon-btn:hover {
            background: var(--accent);
            color: #000;
        }
        .icon-btn.rotate { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Main ── */
        main {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1.2rem 1.2rem 2rem;
        }
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.6rem;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 0.4rem 1rem;
            margin-bottom: 1.2rem;
        }
        .last-updated {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .last-updated i { margin-right: 0.3rem; }
        .live-count {
            background: var(--accent);
            color: #000;
            font-weight: 700;
            font-size: 0.75rem;
            padding: 0.1rem 0.8rem;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .live-count .dot {
            width: 6px;
            height: 6px;
            background: #000;
            border-radius: 50%;
            animation: blink 1.2s infinite;
        }
        @keyframes blink { 0%,100%{ opacity:1; } 50%{ opacity:.2; } }

        /* ── Matches Grid ── */
        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        /* ── Match Card ── */
        .match-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: background var(--transition), transform var(--transition);
        }
        .match-card:hover {
            background: var(--card-hover);
            transform: translateY(-2px);
        }
        .match-card .thumb {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            background: var(--bg);
            display: block;
        }
        .match-card .body {
            padding: 0.8rem 1rem 1rem;
        }
        .match-card .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.3rem;
        }
        .match-card .category {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent);
            background: var(--accent-dim);
            padding: 0.05rem 0.6rem;
            border-radius: 20px;
            border: 1px solid transparent;
        }
        .match-card .status-badge {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.05rem 0.6rem;
            border-radius: 20px;
            background: var(--accent-dim);
            color: var(--accent);
            border: 1px solid var(--accent);
        }
        .match-card .status-badge .pulse {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: blink 1.2s infinite;
        }
        .match-card .status-badge.upcoming {
            color: var(--text-muted);
            border-color: var(--border);
            background: transparent;
        }
        .match-card .status-badge.upcoming .pulse {
            background: var(--text-muted);
            animation: none;
        }
        .match-card .tournament {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .match-card .teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.4rem;
            margin: 0.2rem 0 0.6rem;
        }
        .match-card .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.15rem;
            flex: 1;
            text-align: center;
            min-width: 0;
        }
        .match-card .team img {
            width: 38px;
            height: 38px;
            object-fit: contain;
            border-radius: 50%;
            background: var(--bg);
            padding: 3px;
        }
        .match-card .team .name {
            font-size: 0.75rem;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }
        .match-card .vs {
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--text-muted);
            padding: 0 0.1rem;
        }
        .match-card .watch-btn {
            width: 100%;
            padding: 0.4rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            background: var(--accent);
            color: #000;
            transition: background var(--transition), transform var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
        .match-card .watch-btn:hover:not(:disabled) {
            background: #33ff33;
            transform: scale(1.02);
        }
        .match-card .watch-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: var(--border);
            color: var(--text-muted);
        }

        /* ── Loading / Error ── */
        .loading-wrap, .error-wrap {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
            gap: 1rem;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .error-wrap { color: #ff6b6b; }
        .error-wrap i { font-size: 2rem; }

        /* ── Footer ── */
        footer {
            background: var(--card);
            border-top: 1px solid var(--border);
            padding: 0.8rem 1.5rem;
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        footer .disclaimer { max-width: 700px; margin: 0 auto 0.2rem; opacity: 0.6; }
        footer .copy { opacity: 0.4; }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            .matches-grid { grid-template-columns: 1fr; }
            .match-card .team img { width: 32px; height: 32px; }
            .match-card .team .name { font-size: 0.7rem; }
            .logo { font-size: 1.2rem; }
            .logo small { display: none; }
            main { padding: 0.8rem 0.8rem 1.2rem; }
            .info-bar { flex-direction: column; align-items: stretch; }
            .live-count { align-self: flex-start; }
        }
        @media (min-width: 641px) and (max-width: 900px) {
            .matches-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div class="header-content">
        <a href="index.html" class="logo">FANCOD <span>·</span> RK</a>
        <div class="controls">
            <button class="icon-btn" id="refreshBtn" title="Refresh">
                <i class="fas fa-sync-alt"></i>
            </button>
            <button class="icon-btn" id="themeBtn" title="Toggle theme">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </div>
</header>

<main>
    <div class="info-bar">
        <div class="last-updated"><i class="far fa-clock"></i> Updated: <span id="lastUpdated">—</span></div>
        <div class="live-count"><span class="dot"></span> <span id="liveCount">0</span> LIVE</div>
    </div>
    <div class="matches-grid" id="matchesGrid">
        <div class="loading-wrap">
            <div class="spinner"></div>
            <p>Loading matches …</p>
        </div>
    </div>
</main>

<footer>
    <div class="disclaimer"><i class="fas fa-shield-alt"></i> Educational purposes only. We do not host any streams.</div>
    <div class="copy">&copy; 2025 FANCOD · RK. All rights reserved.</div>
</footer>

<script>
    /* ============================================================
       CONFIG
       ============================================================ */
    const JSON_URL = 'https://raw.githubusercontent.com/doctor-8trange/zyphx8/refs/heads/main/data/fancode.json';

    /* ============================================================
       DOM REFS
       ============================================================ */
    const grid = document.getElementById('matchesGrid');
    const lastUpdatedEl = document.getElementById('lastUpdated');
    const liveCountEl = document.getElementById('liveCount');
    const refreshBtn = document.getElementById('refreshBtn');
    const themeBtn = document.getElementById('themeBtn');

    /* ============================================================
       THEME
       ============================================================ */
    (function initTheme() {
        const stored = localStorage.getItem('fc-theme');
        const prefers = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        const theme = stored || prefers;
        document.documentElement.setAttribute('data-theme', theme);
        updateThemeIcon(theme);
    })();

    function updateThemeIcon(theme) {
        const icon = themeBtn.querySelector('i');
        icon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
    }

    themeBtn.addEventListener('click', () => {
        const cur = document.documentElement.getAttribute('data-theme');
        const next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('fc-theme', next);
        updateThemeIcon(next);
    });

    /* ============================================================
       HELPERS
       ============================================================ */
    function safe(str) {
        if (!str && str !== 0) return '';
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
        return String(str).replace(/[&<>"']/g, m => map[m]);
    }

    function getVal(obj, path, fallback) {
        try {
            const parts = path.split('.');
            let cur = obj;
            for (const p of parts) {
                if (cur === null || cur === undefined) return fallback;
                cur = cur[p];
            }
            return (cur === null || cur === undefined) ? fallback : cur;
        } catch (_) { return fallback; }
    }

    function isLive(status) {
        if (!status) return false;
        const s = String(status).toUpperCase();
        return s === 'LIVE' || s === 'STARTED';
    }

    function isValidUrl(str) {
        try {
            const url = new URL(str);
            return url.protocol === 'http:' || url.protocol === 'https:';
        } catch (_) { return false; }
    }

    function isM3u8(str) {
        if (!str || typeof str !== 'string') return false;
        return str.toLowerCase().includes('.m3u8');
    }

    /* Extract all m3u8 URLs from a text (master playlist) */
    function extractM3u8UrlsFromString(text) {
        const regex = /https?:\/\/[^\s"']+\.m3u8(?:\?[^\s"']*)?/g;
        return text.match(regex) || [];
    }

    /* ============================================================
       STREAM EXTRACTION (recursive, with auth token appending)
       ============================================================ */
    function getAuthToken(match) {
        // Look for auto_streams[0].cookie
        const auto = getVal(match, 'auto_streams.0', null);
        if (auto && typeof auto === 'object') {
            const cookie = auto.cookie;
            if (typeof cookie === 'string' && cookie.trim().length > 0) {
                // cookie is like "hdntl=Expires=...~_GO=...~acl=...~Signature=..."
                return cookie;
            }
        }
        return '';
    }

    function appendAuthToUrl(url, token) {
        if (!token) return url;
        // If URL already has query, append with &, else ?
        const hasQuery = url.includes('?');
        const separator = hasQuery ? '&' : '?';
        // token may already contain "hdntl=..." but we need to append as query parameter
        // If the token already appears as a query parameter, skip
        if (url.includes('hdntl=')) return url; // already has auth
        return url + separator + token;
    }

    function extractStreams(obj, path = '', visited = new Set(), token = '') {
        const results = [];

        if (!obj || typeof obj !== 'object') return results;

        // Avoid circular references
        if (typeof obj === 'object' && obj !== null) {
            const ref = obj;
            if (visited.has(ref)) return results;
            visited.add(ref);
        }

        // If it's a string, check for m3u8 URLs
        if (typeof obj === 'string') {
            // Single URL?
            if (isM3u8(obj) && isValidUrl(obj)) {
                const urlWithAuth = appendAuthToUrl(obj, token);
                results.push({ url: urlWithAuth, path: path, raw: obj });
            } else {
                // Possibly contains multiple URLs (e.g., master playlist content)
                const urls = extractM3u8UrlsFromString(obj);
                for (const url of urls) {
                    if (isValidUrl(url)) {
                        const urlWithAuth = appendAuthToUrl(url, token);
                        results.push({ url: urlWithAuth, path: path + '[extracted]', raw: url });
                    }
                }
            }
            return results;
        }

        // If it's an array, recurse
        if (Array.isArray(obj)) {
            for (let i = 0; i < obj.length; i++) {
                const sub = extractStreams(obj[i], `${path}[${i}]`, visited, token);
                results.push(...sub);
            }
            return results;
        }

        // If it's an object, recurse into all enumerable properties
        if (typeof obj === 'object' && obj !== null) {
            for (const [key, value] of Object.entries(obj)) {
                const sub = extractStreams(value, `${path}.${key}`, visited, token);
                results.push(...sub);
            }
        }

        return results;
    }

    function deduplicateStreams(rawStreams) {
        const seen = new Map();
        const unique = [];
        for (const s of rawStreams) {
            const url = s.url;
            if (seen.has(url)) continue;
            seen.set(url, true);
            // Generate label from path
            let label = 'Stream';
            const pathParts = s.path.split('.').filter(p => p && !p.match(/^\[\d+\]$/));
            const lastPart = pathParts[pathParts.length - 1] || '';
            const clean = lastPart
                .replace(/^_+/, '')
                .replace(/_/g, ' ')
                .replace(/\b\w/g, c => c.toUpperCase())
                .trim();
            if (clean && clean.length < 30) {
                label = clean;
            } else {
                try {
                    const urlObj = new URL(url);
                    const host = urlObj.hostname.replace(/^www\./, '').split('.')[0];
                    if (host) label = host.charAt(0).toUpperCase() + host.slice(1);
                } catch (_) {}
            }
            unique.push({ url, label });
        }
        return unique;
    }

    function getStreamsForMatch(match) {
        const token = getAuthToken(match);
        const raw = extractStreams(match, '', new Set(), token);
        // Also manually extract from auto_streams[0].auto if present (already handled)
        // and from STREAMING_CDN.* fields (also handled)
        const unique = deduplicateStreams(raw);
        return unique;
    }

    /* ==========================================================
