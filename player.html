<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FANCOD · RK — Stream</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Shaka Player -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.13/shaka-player.compiled.js"></script>
    <style>
        /* ── Minimalist retro dark theme ── */
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg: #0b0b0b;
            --card: #141414;
            --text: #e0e0e0;
            --text-muted: #777;
            --border: #2a2a2a;
            --accent: #00ff00;
            --accent-dim: rgba(0,255,0,.08);
            --radius: 4px;
        }
        [data-theme="light"] {
            --bg: #f0f0f0;
            --card: #ffffff;
            --text: #1a1a1a;
            --text-muted: #666;
            --border: #ccc;
            --accent-dim: rgba(0,200,0,.06);
        }
        html, body { height:100%; background:var(--bg); color:var(--text); font-family:'SF Mono', monospace; font-size:14px; line-height:1.5; }
        ::-webkit-scrollbar { width:4px; height:4px; }
        ::-webkit-scrollbar-track { background:var(--bg); }
        ::-webkit-scrollbar-thumb { background:var(--accent); border-radius:2px; }

        /* ── Header ── */
        header {
            background:var(--card);
            border-bottom:1px solid var(--border);
            padding:0.6rem 1.2rem;
            position:sticky;
            top:0;
            z-index:100;
        }
        .header-content {
            max-width:1280px;
            margin:0 auto;
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:0.6rem;
        }
        .logo {
            font-size:1.4rem;
            font-weight:700;
            color:var(--text);
            text-decoration:none;
            display:flex;
            align-items:center;
            gap:0.4rem;
        }
        .logo span { color:var(--accent); }
        .logo small { font-size:0.65rem; font-weight:400; color:var(--text-muted); }
        .controls {
            display:flex;
            align-items:center;
            gap:0.4rem;
        }
        .icon-btn, .back-btn {
            background:var(--accent-dim);
            border:1px solid var(--border);
            color:var(--text);
            padding:0.3rem 0.8rem;
            border-radius:var(--radius);
            cursor:pointer;
            font-size:0.85rem;
            transition:background .15s, color .15s;
            display:inline-flex;
            align-items:center;
            gap:0.4rem;
        }
        .icon-btn:hover, .back-btn:hover {
            background:var(--accent);
            color:#000;
        }
        .icon-btn {
            width:34px;
            height:34px;
            justify-content:center;
            padding:0;
            border-radius:50%;
        }
        .icon-btn.rotate { animation:spin 1s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }

        /* ── Main ── */
        main {
            max-width:1100px;
            margin:0 auto;
            padding:1.2rem;
            display:flex;
            flex-direction:column;
            gap:1rem;
        }

        /* ── Player ── */
        .player-container {
            position:relative;
            background:#000;
            border:1px solid var(--border);
            border-radius:var(--radius);
            aspect-ratio:16/9;
            overflow:hidden;
        }
        .player-container video {
            width:100%;
            height:100%;
            display:block;
            background:#000;
        }

        /* ── Overlay ── */
        .overlay {
            position:absolute;
            inset:0;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            background:rgba(0,0,0,.8);
            backdrop-filter:blur(4px);
            gap:0.8rem;
            z-index:5;
            opacity:0;
            pointer-events:none;
            transition:opacity .3s;
        }
        .overlay.visible {
            opacity:1;
            pointer-events:auto;
        }
        .overlay .spinner {
            width:36px;
            height:36px;
            border:3px solid var(--border);
            border-top-color:var(--accent);
            border-radius:50%;
            animation:spin 1s linear infinite;
        }
        .overlay p { color:#fff; font-size:0.9rem; opacity:0.8; }
        .overlay .error-icon { font-size:2rem; color:#ff4444; }
        .overlay .retry-btn {
            background:var(--accent);
            color:#000;
            border:none;
            padding:0.4rem 1.6rem;
            border-radius:var(--radius);
            font-weight:700;
            cursor:pointer;
        }
        .overlay .retry-btn:hover { transform:scale(1.03); }

        /* ── Live Badge ── */
        .live-badge {
            position:absolute;
            top:12px;
            left:12px;
            background:#ff4444;
            color:#fff;
            font-size:0.7rem;
            font-weight:700;
            padding:0.15rem 0.7rem;
            border-radius:20px;
            display:flex;
            align-items:center;
            gap:0.4rem;
            z-index:4;
            text-transform:uppercase;
            opacity:0;
            transition:opacity .3s;
        }
        .live-badge.visible { opacity:1; }
        .live-badge .dot {
            width:6px;
            height:6px;
            background:#fff;
            border-radius:50%;
            animation:pulse-dot 1.2s infinite;
        }
        @keyframes pulse-dot { 0%,100%{ opacity:1; } 50%{ opacity:.2; } }

        /* ── Match Info ── */
        .match-info {
            background:var(--card);
            border:1px solid var(--border);
            border-radius:var(--radius);
            padding:0.8rem 1.2rem;
            display:flex;
            flex-wrap:wrap;
            align-items:center;
            justify-content:space-between;
            gap:0.6rem;
        }
        .match-info .teams { display:flex; align-items:center; gap:0.8rem; flex-wrap:wrap; }
        .match-info .team { display:flex; align-items:center; gap:0.4rem; }
        .match-info .team img { width:28px; height:28px; object-fit:contain; border-radius:50%; background:var(--bg); padding:2px; }
        .match-info .team .name { font-weight:600; font-size:0.9rem; }
        .match-info .vs { font-weight:800; color:var(--text-muted); font-size:0.75rem; }
        .match-info .meta { display:flex; flex-wrap:wrap; align-items:center; gap:0.6rem; font-size:0.8rem; color:var(--text-muted); }
        .match-info .meta i { color:var(--accent); width:1.1rem; }
        .match-info .status-badge {
            background:var(--accent);
            color:#000;
            font-weight:700;
            font-size:0.65rem;
            padding:0.1rem 0.6rem;
            border-radius:20px;
            text-transform:uppercase;
            display:inline-flex;
            align-items:center;
            gap:0.3rem;
        }
        .match-info .status-badge.offline { background:var(--border); color:var(--text-muted); }
        .match-info .status-badge .pulse {
            width:5px;
            height:5px;
            background:#000;
            border-radius:50%;
            animation:blink 1.2s infinite;
        }
        .match-info .status-badge.offline .pulse { animation:none; background:var(--text-muted); }
        @keyframes blink { 0%,100%{ opacity:1; } 50%{ opacity:.2; } }

        /* ── CDN Selector ── */
        .cdn-selector {
            background:var(--card);
            border:1px solid var(--border);
            border-radius:var(--radius);
            padding:0.8rem 1.2rem;
        }
        .cdn-selector h4 {
            font-size:0.85rem;
            font-weight:600;
            color:var(--text-muted);
            display:flex;
            align-items:center;
            gap:0.5rem;
            margin-bottom:0.5rem;
        }
        .cdn-selector h4 i { color:var(--accent); }
        .cdn-grid {
            display:flex;
            flex-wrap:wrap;
            gap:0.4rem;
        }
        .cdn-btn {
            background:var(--accent-dim);
            border:1px solid var(--border);
            color:var(--text);
            padding:0.3rem 0.9rem;
            border-radius:20px;
            font-weight:600;
            font-size:0.75rem;
            cursor:pointer;
            transition:all .15s;
            white-space:nowrap;
        }
        .cdn-btn:hover { background:var(--accent); color:#000; border-color:var(--accent); }
        .cdn-btn.active {
            background:var(--accent);
            color:#000;
            border-color:var(--accent);
            box-shadow:0 0 16px rgba(0,255,0,.3);
        }
        .cdn-btn:disabled { opacity:0.4; cursor:not-allowed; }

        /* ── Quality Selector ── */
        .quality-selector {
            background:var(--card);
            border:1px solid var(--border);
            border-radius:var(--radius);
            padding:0.8rem 1.2rem;
        }
        .quality-selector h4 {
            font-size:0.85rem;
            font-weight:600;
            color:var(--text-muted);
            display:flex;
            align-items:center;
            gap:0.5rem;
            margin-bottom:0.5rem;
        }
        .quality-selector h4 i { color:var(--accent); }
        .quality-grid {
            display:flex;
            flex-wrap:wrap;
            gap:0.4rem;
        }
        .quality-btn {
            background:var(--accent-dim);
            border:1px solid var(--border);
            color:var(--text);
            padding:0.3rem 0.9rem;
            border-radius:20px;
            font-weight:600;
            font-size:0.75rem;
            cursor:pointer;
            transition:all .15s;
            white-space:nowrap;
        }
        .quality-btn:hover { background:var(--accent); color:#000; border-color:var(--accent); }
        .quality-btn.active {
            background:var(--accent);
            color:#000;
            border-color:var(--accent);
            box-shadow:0 0 16px rgba(0,255,0,.3);
        }
        .quality-btn:disabled { opacity:0.4; cursor:not-allowed; }

        .no-streams { color:var(--text-muted); padding:0.5rem 0; text-align:center; width:100%; }

        /* ── Footer ── */
        footer {
            background:var(--card);
            border-top:1px solid var(--border);
            padding:0.8rem 1.2rem;
            text-align:center;
            font-size:0.7rem;
            color:var(--text-muted);
        }
        footer .disclaimer { max-width:700px; margin:0 auto 0.1rem; opacity:0.6; }

        /* ── Responsive ── */
        @media (max-width:640px) {
            .match-info { flex-direction:column; align-items:stretch; }
            .match-info .teams { justify-content:center; }
            .match-info .meta { justify-content:center; }
            .cdn-grid, .quality-grid { justify-content:center; }
            .logo { font-size:1.2rem; }
            .logo small { display:none; }
            main { padding:0.8rem; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-content">
        <a href="index.html" class="logo">FANCOD <span>·</span> RK <small>Stream</small></a>
        <div class="controls">
            <button class="back-btn" onclick="window.location.href='index.html'">
                <i class="fas fa-arrow-left"></i> Back
            </button>
            <button class="icon-btn" id="themeBtn" title="Toggle theme">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </div>
</header>

<main>
    <!-- Player -->
    <div class="player-container" id="playerContainer">
        <video id="videoPlayer" controls autoplay playsinline preload="auto"></video>
        <div class="overlay" id="playerOverlay">
            <div class="spinner" id="overlaySpinner"></div>
            <p id="overlayText">Loading stream …</p>
        </div>
        <div class="live-badge" id="liveBadge"><span class="dot"></span> LIVE</div>
    </div>

    <!-- Match Info -->
    <div id="infoArea"></div>

    <!-- CDN Source Selector -->
    <div class="cdn-selector" id="cdnSelector">
        <h4><i class="fas fa-server"></i> CDN Sources</h4>
        <div class="cdn-grid" id="cdnGrid"><div class="no-streams">Loading …</div></div>
    </div>

    <!-- Quality Selector -->
    <div class="quality-selector" id="qualitySelector">
        <h4><i class="fas fa-sliders-h"></i> Quality</h4>
        <div class="quality-grid" id="qualityGrid"><div class="no-streams">No tracks loaded</div></div>
    </div>
</main>

<footer>
    <div class="disclaimer"><i class="fas fa-shield-alt"></i> Educational only. We do not host streams.</div>
</footer>

<script>
    /* ============================================================
       CONFIG
       ============================================================ */
    const JSON_URL = 'https://raw.githubusercontent.com/doctor-8trange/zyphx8/refs/heads/main/data/fancode.json';

    /* ============================================================
       DOM REFS
       ============================================================ */
    const video = document.getElementById('videoPlayer');
    const overlay = document.getElementById('playerOverlay');
    const overlaySpinner = document.getElementById('overlaySpinner');
    const overlayText = document.getElementById('overlayText');
    const liveBadge = document.getElementById('liveBadge');
    const infoArea = document.getElementById('infoArea');
    const cdnGrid = document.getElementById('cdnGrid');
    const qualityGrid = document.getElementById('qualityGrid');
    const themeBtn = document.getElementById('themeBtn');

    /* ============================================================
       THEME
       ============================================================ */
    (function initTheme() {
        const stored = localStorage.getItem('fc-theme');
        const prefers = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        const theme = stored || prefers;
        document.documentElement.setAttribute('data-theme', theme);
        updateThemeIcon(theme);
    })();

    function updateThemeIcon(theme) {
        const icon = themeBtn.querySelector('i');
        icon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
    }

    themeBtn.addEventListener('click', () => {
        const cur = document.documentElement.getAttribute('data-theme');
        const next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('fc-theme', next);
        updateThemeIcon(next);
    });

    /* ============================================================
       HELPERS
       ============================================================ */
    function safe(str) {
        if (!str && str !== 0) return '';
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
        return String(str).replace(/[&<>"']/g, m => map[m]);
    }

    function getVal(obj, path, fallback) {
        try {
            const parts = path.split('.');
            let cur = obj;
            for (const p of parts) {
                if (cur === null || cur === undefined) return fallback;
                cur = cur[p];
            }
            return (cur === null || cur === undefined) ? fallback : cur;
        } catch (_) { return fallback; }
    }

    function isLiveStatus(status) {
        if (!status) return false;
        const s = String(status).toUpperCase();
        return s === 'LIVE' || s === 'STARTED';
    }

    /* ============================================================
       SHAKA PLAYER SETUP
       ============================================================ */
    let player = null;
    let currentMatch = null;
    let allCdnSources = [];
    let currentCdnKey = null;
    let isShakaReady = false;

    function initShaka() {
        return new Promise((resolve) => {
            if (typeof shaka === 'undefined') {
                // Shaka not loaded yet
                const check = setInterval(() => {
                    if (typeof shaka !== 'undefined') {
                        clearInterval(check);
                        setupShaka();
                        resolve();
                    }
                }, 100);
            } else {
                setupShaka();
                resolve();
            }
        });
    }

    function setupShaka() {
        if (!shaka.Player.isBrowserSupported()) {
            showError('Browser not supported for Shaka Player.');
            return;
        }
        player = new shaka.Player(video);

        // Networking filter to inject custom headers
        player.getNetworkingEngine().registerRequestFilter((type, request) => {
            if (type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
                type === shaka.net.NetworkingEngine.RequestType.SEGMENT) {
                // Add custom headers
                request.headers['User-Agent'] = 'Mozilla/5.0 (compatible; SmartProxy)';
                request.headers['Accept'] = '*/*';
                request.headers['Accept-Language'] = 'en-US,en;q=0.9';
                request.headers['Connection'] = 'keep-alive';
                // Optionally add referer
                request.headers['Referer'] = 'https://fancode.com/';
            }
        });

        // Error handling
        player.addEventListener('error', onShakaError);

        // When manifest is parsed, populate quality buttons
        player.addEventListener('manifestparsed', () => {
            hideOverlay();
            populateQualities();
            // Enable ABR by default (auto)
            setQuality('auto');
        });

        // Handle loading
        player.addEventListener('loading', () => {
            showOverlay(true, 'Loading manifest …');
        });

        // Handle unloading
        player.addEventListener('unloading', () => {
            // clear qualities
            qualityGrid.innerHTML = '<div class="no-streams">No tracks loaded</div>';
        });

        // Handle buffering
        player.addEventListener('buffering', (e) => {
            if (e.buffering) {
                showOverlay(true, 'Buffering …');
            } else {
                hideOverlay();
            }
        });

        isShakaReady = true;
    }

    function onShakaError(event) {
        const error = event.detail;
        console.error('Shaka error:', error);
        // Attempt recovery: try next CDN if fatal
        if (error.category === shaka.util.Error.Category.NETWORK ||
            error.category === shaka.util.Error.Category.MANIFEST) {
            // Try next CDN
            if (currentCdnKey && allCdnSources.length) {
                const currentIndex = allCdnSources.findIndex(s => s.key === currentCdnKey);
                let nextIndex = (currentIndex + 1) % allCdnSources.length;
                // Avoid infinite loop if only one
                if (allCdnSources.length === 1) {
                    showError('All CDN sources failed.');
                    return;
                }
                // Try next, but if we've looped, give up
                let attempts = 0;
                const tryNext = () => {
                    if (attempts >= allCdnSources.length) {
                        showError('All CDN sources failed.');
                        return;
                    }
                    const next = allCdnSources[nextIndex];
                    if (next && next.url) {
                        showOverlay(true, `Switching to ${next.label} …`);
                        loadCdnSource(next.key, next.url);
                    } else {
                        // skip if no url
                        nextIndex = (nextIndex + 1) % allCdnSources.length;
                        attempts++;
                        tryNext();
                    }
                };
                tryNext();
            } else {
                showError('Stream error: ' + (error.message || 'Unknown error'));
            }
        } else {
            showError('Shaka error: ' + (error.message || 'Unknown error'));
        }
    }

    /* ============================================================
       LOAD MATCH
       ============================================================ */
    function getMatchId() {
        const params = new URLSearchParams(window.location.search);
        return params.get('id');
    }

    async function loadMatch() {
        const id = getMatchId();
        if (!id) {
            showError('No match ID provided.');
            return;
        }

        try {
            const resp = await fetch(JSON_URL);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const json = await resp.json();
            const matches = json?.matches;
            if (!Array.isArray(matches)) throw new Error('Invalid data');

            const match = matches.find(m => String(getVal(m, 'match_id', '')) === id);
            if (!match) throw new Error('Match not found');

            currentMatch = match;
            renderMatch(match);
            // Initialize Shaka after UI is ready
            await initShaka();
            // Build CDN sources and auto-load first
            buildCdnSources(match);
            // Auto-select first CDN
            if (allCdnSources.length) {
                const first = allCdnSources[0];
                loadCdnSource(first.key, first.url);
            } else {
                showError('No CDN sources available.');
            }
        } catch (err) {
            console.error('Load error:', err);
            showError(err.message);
        }
    }

    /* ============================================================
       RENDER MATCH INFO
       ============================================================ */
    function renderMatch(match) {
        const status = getVal(match, 'status', '');
        const isLive = isLiveStatus(status);
        const tournament = getVal(match, 'tournament', '');
        const category = getVal(match, 'category', '');

        const t1 = getVal(match, 'team.0', {});
        const t2 = getVal(match, 'team.1', {});
        const t1Name = getVal(t1, 'name', getVal(t1, 'shortName', 'Team 1'));
        const t2Name = getVal(t2, 'name', getVal(t2, 'shortName', 'Team 2'));
        const t1Logo = getVal(t1, 'flag.src', '');
        const t2Logo = getVal(t2, 'flag.src', '');

        const statusHtml = isLive ?
            `<span class="status-badge"><span class="pulse"></span> LIVE</span>` :
            `<span class="status-badge offline">${safe(status) || 'Upcoming'}</span>`;

        infoArea.innerHTML = `
            <div class="match-info">
                <div class="teams">
                    <div class="team">
                        ${t1Logo ? `<img src="${safe(t1Logo)}" onerror="this.style.display='none'">` : ''}
                        <span class="name">${safe(t1Name)}</span>
                    </div>
                    <span class="vs">VS</span>
                    <div class="team">
                        ${t2Logo ? `<img src="${safe(t2Logo)}" onerror="this.style.display='none'">` : ''}
                        <span class="name">${safe(t2Name)}</span>
                    </div>
                </div>
                <div class="meta">
                    ${tournament ? `<span><i class="fas fa-trophy"></i> ${safe(tournament)}</span>` : ''}
                    ${category ? `<span><i class="fas fa-tag"></i> ${safe(category)}</span>` : ''}
                    ${statusHtml}
                </div>
            </div>
        `;

        if (isLive) liveBadge.classList.add('visible');
        else liveBadge.classList.remove('visible');
    }

    /* ============================================================
       BUILD CDN SOURCES
       ============================================================ */
    function buildCdnSources(match) {
        const cdnObj = getVal(match, 'STREAMING_CDN', {});
        const cookie = getVal(match, 'auto_streams.0.cookie', '');
        const sources = [];

        // Helper to add a source
        function addSource(key, url) {
            if (!url || typeof url !== 'string') return;
            url = url.trim();
            if (!url.startsWith('http://') && !url.startsWith('https://')) return;
            // Append cookie as query param if available
            if (cookie && cookie.trim()) {
                const separator = url.includes('?') ? '&' : '?';
                url += separator + cookie;
            }
            sources.push({ key, label: key.replace(/_/g, ' ').toUpperCase(), url });
        }

        // Iterate over all properties of cdnObj
        for (const [key, value] of Object.entries(cdnObj)) {
            if (key === 'language') continue; // skip language
            if (typeof value === 'string') {
                addSource(key, value);
            } else if (value && typeof value === 'object') {
                // handle nested objects like 'backup'
                for (const [subKey, subVal] of Object.entries(value)) {
                    if (typeof subVal === 'string') {
                        addSource(`${key}.${subKey}`, subVal);
                    }
                }
            }
        }

        // Also include auto_streams? No, we use CDN from STREAMING_CDN as per requirement.
        // But we'll also include the Primary if present.
        // Ensure Primary is included (it might be duplicated)
        // Remove duplicates by URL
        const uniqueMap = new Map();
        for (const src of sources) {
            if (!uniqueMap.has(src.url)) {
                uniqueMap.set(src.url, src);
            }
        }
        allCdnSources = Array.from(uniqueMap.values());

        // Render CDN buttons
        renderCdnButtons();
    }

    function renderCdnButtons() {
        if (!allCdnSources.length) {
            cdnGrid.innerHTML = '<div class="no-streams">No CDN sources found</div>';
            return;
        }
        let html = '';
        for (const src of allCdnSources) {
            const active = (currentCdnKey === src.key) ? 'active' : '';
            html += `
                <button class="cdn-btn ${active}" data-key="${safe(src.key)}" data-url="${safe(src.url)}">
                    ${safe(src.label)}
                    ${active ? ' <i class="fas fa-check" style="font-size:0.6rem;"></i>' : ''}
                </button>
            `;
        }
        cdnGrid.innerHTML = html;

        document.querySelectorAll('.cdn-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const key = this.dataset.key;
                const url = this.dataset.url;
                if (key && url) loadCdnSource(key, url);
            });
        });
    }

    /* ============================================================
       LOAD CDN SOURCE
       ============================================================ */
    function loadCdnSource(key, url) {
        if (!player) {
            showError('Player not initialized.');
            return;
        }
        if (!url) {
            showError('Invalid URL.');
            return;
        }
        currentCdnKey = key;
        // Update active button
        document.querySelectorAll('.cdn-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.key === key);
        });
        showOverlay(true, `Loading ${key} …`);
        // Clear quality buttons
        qualityGrid.innerHTML = '<div class="no-streams">Loading tracks …</div>';

        // Load with Shaka
        try {
            player.load(url).catch((e) => {
                // Error will be handled by onShakaError
                console.error('Load failed:', e);
            });
        } catch (e) {
            console.error('Load exception:', e);
            onShakaError({ detail: e });
        }
    }

    /* ============================================================
       QUALITY SELECTION
       ============================================================ */
    let currentQuality = 'auto';

    function populateQualities() {
        if (!player) return;
        const tracks = player.getVariantTracks();
        // Filter only video tracks (with height)
        const videoTracks = tracks.filter(t => t.height > 0);
        if (!videoTracks.length) {
            qualityGrid.innerHTML = '<div class="no-streams">No video tracks</div>';
            return;
        }
        // Build unique resolutions sorted
        const resolutions = new Set();
        for (const t of videoTracks) {
            resolutions.add(t.height);
        }
        const sorted = Array.from(resolutions).sort((a,b) => a-b);

        // Create buttons: Auto first, then descending (1080p, 720p, etc.)
        let html = '';
        // Auto button
        const autoActive = (currentQuality === 'auto') ? 'active' : '';
        html += `<button class="quality-btn ${autoActive}" data-quality="auto">Auto</button>`;

        // Descending order (high to low)
        const sortedDesc = sorted.slice().reverse();
        for (const h of sortedDesc) {
            const label = h + 'p';
            const active = (currentQuality === label) ? 'active' : '';
            html += `<button class="quality-btn ${active}" data-quality="${label}" data-height="${h}">${label}</button>`;
        }
        qualityGrid.innerHTML = html;

        // Add event listeners
        document.querySelectorAll('.quality-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const quality = this.dataset.quality;
                if (quality) setQuality(quality);
            });
        });
    }

    function setQuality(quality) {
        if (!player) return;
        currentQuality = quality;
        // Update UI
        document.querySelectorAll('.quality-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.quality === quality);
        });

        if (quality === 'auto') {
            // Enable ABR
            player.configure({ abr: { enabled: true } });
            // Deselect any forced track
            player.selectVariantTrack(null);
            return;
        }

        // Disable ABR
        player.configure({ abr: { enabled: false } });

        // Find track with matching height
        const height = parseInt(quality, 10);
        const tracks = player.getVariantTracks();
        // Prefer video tracks with that height, and pick one (prefer higher bandwidth)
        const matching = tracks.filter(t => t.height === height);
        if (matching.length) {
            // Sort by bandwidth descending
            matching.sort((a,b) => b.bandwidth - a.bandwidth);
            player.selectVariantTrack(matching[0]);
        } else {
            console.warn('No track found for height', height);
            // Fallback to auto
            player.configure({ abr: { enabled: true } });
            player.selectVariantTrack(null);
        }
    }

    /* ============================================================
       OVERLAY
       ============================================================ */
    function showOverlay(show, text) {
        if (show) {
            overlay.classList.add('visible');
            overlaySpinner.style.display = 'block';
            overlayText.textContent = text || 'Loading …';
            const errIcon = overlay.querySelector('.error-icon');
            if (errIcon) errIcon.remove();
            const retryBtn = overlay.querySelector('.retry-btn');
            if (retryBtn) retryBtn.remove();
        } else {
            overlay.classList.remove('visible');
        }
    }

    function hideOverlay() { showOverlay(false); }

    function showError(msg) {
        overlay.classList.add('visible');
        overlaySpinner.style.display = 'none';
        overlayText.textContent = msg || 'Error';
        const oldIcon = overlay.querySelector('.error-icon');
        if (oldIcon) oldIcon.remove();
        const oldBtn = overlay.querySelector('.retry-btn');
        if (oldBtn) oldBtn.remove();
        const icon = document.createElement('div');
        icon.className = 'error-icon';
        icon.innerHTML = '<i class="fas fa-triangle-exclamation"></i>';
        overlay.prepend(icon);
        const btn = document.createElement('button');
        btn.className = 'retry-btn';
        btn.textContent = 'Retry';
        btn.onclick = () => {
            if (currentCdnKey && allCdnSources.length) {
                const current = allCdnSources.find(s => s.key === currentCdnKey);
                if (current) loadCdnSource(current.key, current.url);
                else if (allCdnSources.length) loadCdnSource(allCdnSources[0].key, allCdnSources[0].url);
            } else {
                loadMatch();
            }
        };
        overlay.appendChild(btn);
    }

    /* ============================================================
       BOOT
       ============================================================ */
    loadMatch();

    // Expose for debugging
    window.__player = { player, loadCdnSource, setQuality, allCdnSources };
</script>
</body>
</html>
